<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Pheme — the goddess of renown. Her initial Φ drawn in the Mnemosyne flow
    gradient (the same strand as the OS lemniscate), over the brand plate,
    flanked by a laurel hint: renown, earned.
  -->
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B5EA7"/>
      <stop offset="45%" stop-color="#A98BFF"/>
      <stop offset="100%" stop-color="#E4D6FF"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#7C4DFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0E0E13"/>
  <rect width="64" height="64" rx="14" fill="url(#bloom)"/>

  <!-- Laurel hint — two arcs cradling the mark. -->
  <g stroke="#A98BFF" stroke-width="1.6" fill="none" opacity="0.32" stroke-linecap="round">
    <path d="M15 48 A21 21 0 0 1 11 27"/>
    <path d="M49 48 A21 21 0 0 0 53 27"/>
  </g>

  <!-- Φ — glow pass, then the strand. -->
  <g filter="url(#glow)" opacity="0.55">
    <circle cx="32" cy="30" r="12.5" fill="none" stroke="url(#flow)" stroke-width="4.4"/>
    <line x1="32" y1="11" x2="32" y2="52" stroke="url(#flow)" stroke-width="4.4" stroke-linecap="round"/>
  </g>
  <circle cx="32" cy="30" r="12.5" fill="none" stroke="url(#flow)" stroke-width="4.4"/>
  <line x1="32" y1="11" x2="32" y2="52" stroke="url(#flow)" stroke-width="4.4" stroke-linecap="round"/>
</svg>
